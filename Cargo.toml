[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
gix = { version = "0.89", default-features = false, features = ["revision", "blob-diff", "sha1", "parallel"] }
imara-diff = "0.2"
similar = "3"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
tempfile = "3"
eframe = "0.36"
egui = "0.36"
rfd = "0.17"

[profile.dev.package."*"]
opt-level = 2
